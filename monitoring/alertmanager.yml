# Alertmanager: decides where alerts go. As shipped it receives alerts and
# shows them at http://localhost:9093 but notifies nobody. Fill in ONE of the
# examples below under `receivers:` and keep `receiver: default` in the route.
route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # --- Email ---
    # email_configs:
