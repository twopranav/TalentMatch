# Prometheus for TalentMatch. Started by docker-compose.monitoring.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: talentmatch-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    # In production /metrics is disabled unless METRICS_TOKEN is set (backend/.env).
    # Then put the same token in monitoring/metrics_token (no newline), mount it
    # (see docker-compose.monitoring.yml) and uncomment:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token
