<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  USERS ||--o{ JOBS : creates
  JOBS ||--o{ JOB_REQUIREMENTS : has
  JOBS ||--o{ APPLICATIONS : receives
  CANDIDATES ||--o{ RESUMES : uploads
  CANDIDATES ||--o{ APPLICATIONS : submits
  RESUMES ||--o| CANDIDATE_PROFILES : "parsed into"
  APPLICATIONS ||--o| MATCH_SCORES : scored_by
  APPLICATIONS ||--o{ RECRUITER_ACTIONS : has
  USERS ||--o{ RECRUITER_ACTIONS : performs
  USERS ||--o{ AUDIT_LOGS : generates

  USERS {
    uuid id PK
    string email
    string hashed_password
    string full_name
    string role
    timestamp created_at
  }
  JOBS {
    uuid id PK
    uuid created_by FK
    string title
    text jd_raw_text
    string status
    timestamp created_at
  }
  JOB_REQUIREMENTS {
    uuid id PK
    uuid job_id FK
    string req_type
    string value
    bool is_mandatory
    float weight
  }
  CANDIDATES {
    uuid id PK
    string email
    string full_name
    string phone
    timestamp created_at
  }
  RESUMES {
    uuid id PK
    uuid candidate_id FK
    string file_path
    string original_filename
    string upload_status
    timestamp created_at
  }
  CANDIDATE_PROFILES {
    uuid id PK
    uuid resume_id FK
    json skills
    float experience_years
    json education
    json raw_extracted_json
    string embedding_ref
  }
  APPLICATIONS {
    uuid id PK
    uuid job_id FK
    uuid candidate_id FK
    uuid resume_id FK
    string status
    timestamp created_at
  }
  MATCH_SCORES {
    uuid id PK
    uuid application_id FK
    float rule_score
    float semantic_score
    float final_score
    json matched_skills
    json missing_skills
    timestamp scored_at
  }
  RECRUITER_ACTIONS {
    uuid id PK
    uuid application_id FK
    uuid performed_by FK
    string action_type
    text notes
    timestamp created_at
  }
  AUDIT_LOGS {
    uuid id PK
    uuid actor_id FK
    string action
    string entity_type
    uuid entity_id
    json metadata
    timestamp created_at
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
