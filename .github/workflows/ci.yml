name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The test suite derives its own database by appending "_test" to
          # DATABASE_URL's name (tests/conftest.py) and creates it itself,
          # so this is the *base* database, not the test one.
          POSTGRES_DB: talentdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/talentdb
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: /tmp/storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          # CPU-only torch first (same as the Dockerfile), otherwise
          # sentence-transformers pulls the multi-GB GPU build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov fakeredis httpx pip-audit
      - name: Check migrations apply to a fresh database
        working-directory: backend
        run: alembic upgrade head
      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='talentdb_test'" | grep -q 1 \
            || createdb -h localhost -U postgres talentdb_test
      - name: Run tests
        working-directory: backend
        # -rs prints why each test was skipped, so a missing optional
        # dependency can't hide behind a green run.
        run: pytest -rs --cov=app --cov-report=term
      - name: Scan Python dependencies for known vulnerabilities
        # Advisory for now; remove continue-on-error once the report is clean
        # so new vulnerable dependencies fail the build.
        continue-on-error: true
        run: pip-audit --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Scan npm dependencies for known vulnerabilities
        working-directory: frontend
        # Advisory for now, same as pip-audit above.
        continue-on-error: true
        run: npm audit --audit-level=high