# Optional monitoring stack. Run together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Prometheus:   http://localhost:9090   (Alerts tab shows rule state)
# Alertmanager: http://localhost:9093
# Ports are bound to localhost only; don't expose them publicly.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # - ./monitoring/metrics_token:/etc/prometheus/metrics_token:ro   # production only
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - alertmanager
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  prometheus_data:
